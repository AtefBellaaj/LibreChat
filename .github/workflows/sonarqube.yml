name: SonarQube Cloud

on:
  push:
    branches: [dev, atef/sonarcloud]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan personal fork
    # Only this fork can send analysis to the personal SonarQube project.
    # External fork PRs do not receive SONAR_TOKEN.
    if: >-
      github.repository == 'AtefBellaaj/LibreChat' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/atef/sonarcloud')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check SonarQube credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Add the SONAR_TOKEN repository secret in AtefBellaaj/LibreChat."
            exit 1
          fi

      - name: Check out source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up analysis runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Install complexity analyzer
        run: npm ci --prefix scripts/sonar --ignore-scripts --no-audit --no-fund

      - name: Verify complexity bands and collect coverage
        run: npm run test:coverage --prefix scripts/sonar

      - name: Build complexity report
        run: npm run scan --prefix scripts/sonar

      - name: Analyze source
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

sonar.projectKey=AtefBellaaj_LibreChat
sonar.organization=atefbellaaj
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Allow the analyzer enough heap space for this TypeScript monorepo.
sonar.javascript.node.maxspace=8192

# Generated by scripts/sonar before each scan. A missing report fails analysis.
sonar.externalIssuesReportPaths=.sonar/complexity.json

# Coverage of the analysis tool's Node tests, not the application's Jest suites.
sonar.javascript.lcov.reportPaths=.sonar/lcov.info

# The external report replaces these warnings. Keep other native rules and metrics.
sonar.issue.ignore.multicriteria=cognitiveJs,cognitiveTs,cyclomaticJs,cyclomaticTs
sonar.issue.ignore.multicriteria.cognitiveJs.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cognitiveJs.resourceKey=**/*
sonar.issue.ignore.multicriteria.cognitiveTs.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.cognitiveTs.resourceKey=**/*
sonar.issue.ignore.multicriteria.cyclomaticJs.ruleKey=javascript:S1541
sonar.issue.ignore.multicriteria.cyclomaticJs.resourceKey=**/*
sonar.issue.ignore.multicriteria.cyclomaticTs.ruleKey=typescript:S1541
sonar.issue.ignore.multicriteria.cyclomaticTs.resourceKey=**/*

# Include the application, every package, scripts, and infrastructure files.
sonar.sources=.
sonar.tests=.

# Sonar also removes these test files from the source scope.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/__mocks__/**,**/test/**,**/tests/**,e2e/**,**/jest.setup.*,**/jestSetup.*

# Skip dependencies, build output, and generated reports in either scope.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.turbo/**,.scannerwork/**,.sonar/**,**/*.map
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.turbo/**,.scannerwork/**,.sonar/**,**/*.map
